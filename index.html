<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #223056;
    --ink-soft: #5a6b8c;
    --panel: rgba(255,255,255,0.94);
    --line: #e3ecf7;
    --shadow: 0 16px 40px rgba(60, 90, 150, 0.18);
    --shadow-sm: 0 6px 18px rgba(60, 90, 150, 0.14);

    /* per-card accent + pastel fill */
    --city: #2f74e0;      --city-bg: #dcebfd;
    --temp: #e14b4b;      --temp-bg: #fde3e3;
    --hotter: #efa022;    --hotter-bg: #fff0d4;
    --lookup: #1f9f5c;    --lookup-bg: #dcf3e5;

    --good: #1f9f5c; --good-bg: #e2f6ea;
    --bad: #e14b4b;  --bad-bg: #fde3e3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Nunito", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    position: relative;
    padding: 26px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Scenic illustrated background ---- */
  .scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    object-fit: cover;
  }

  .wrap { width: 100%; max-width: 900px; margin: 0 auto; }

  /* ---- Hero ---- */
  header { text-align: center; margin: 6px 0 26px; }
  header h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.9rem);
    margin: 0 0 6px;
    color: #223056;
    letter-spacing: 0.2px;
  }
  header h1 .sun { filter: drop-shadow(0 3px 6px rgba(240,180,30,0.5)); }
  header p {
    margin: 0; color: #45577c; font-size: clamp(0.9rem, 2.6vw, 1.05rem);
    font-weight: 700;
  }

  /* ---- Menu prompt ---- */
  .pick-prompt {
    text-align: center;
    margin: 0 0 16px;
  }
  .pick-prompt .lead {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: clamp(1.25rem, 4vw, 1.55rem);
    color: #223056;
  }
  .pick-prompt .sub {
    font-weight: 700;
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-top: 2px;
  }

  /* ---- Mode cards ---- */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 620px) { .mode-grid { grid-template-columns: 1fr; } }

  .mode-card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    width: 100%;
    border: 0;
    cursor: pointer;
    border-radius: 22px;
    padding: 20px 20px;
    background: var(--fill);
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, box-shadow .12s ease;
    font-family: inherit;
  }
  .mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .mode-card:active { transform: translateY(-1px); }
  .mode-card .emoji {
    font-size: 1.9rem;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12));
  }
  .mode-card .body { flex: 1; min-width: 0; }
  .mode-card .title {
    display: block;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 1.18rem;
    color: var(--accent);
    line-height: 1.15;
  }
  .mode-card .desc {
    display: block;
    font-size: 0.88rem;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 3px;
  }
  .mode-card .arrow {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .m-city   { --fill: var(--city-bg);   --accent: var(--city); }
  .m-temp   { --fill: var(--temp-bg);   --accent: var(--temp); }
  .m-hotter { --fill: var(--hotter-bg); --accent: var(--hotter); }
  .m-lookup { --fill: var(--lookup-bg); --accent: var(--lookup); }

  /* ---- Settings pill ---- */
  .settings {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; flex-wrap: wrap;
    margin: 22px auto 0;
    background: var(--panel);
    border-radius: 999px;
    padding: 12px 20px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
    max-width: 100%;
    font-weight: 800;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  .seg { display: inline-flex; background: #eef3fa; border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 800;
    background: transparent; color: var(--ink-soft);
    padding: 7px 15px; border-radius: 999px; font-size: 0.9rem;
    transition: background .12s ease, color .12s ease;
  }
  .seg button.on { background: var(--city); color: #fff; box-shadow: 0 3px 8px rgba(47,116,224,0.35); }
  .level-hint {
    text-align: center; margin: 12px auto 0; font-weight: 700;
    color: #3c4f72; font-size: 0.9rem;
    background: rgba(255,255,255,0.75); border-radius: 999px;
    padding: 8px 16px; width: fit-content; max-width: 100%;
  }

  /* ---- Panel (game / lookup / results) ---- */
  .panel {
    background: var(--panel);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-weight: 800; color: var(--ink-soft); font-size: 0.9rem;
  }
  .pill-tag { background: #eef3fa; border-radius: 999px; padding: 5px 12px; }

  /* ---- Weather readout card ---- */
  .wcard {
    background: linear-gradient(180deg, #eaf3ff, #f6faff);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px; margin-bottom: 16px; text-align: center;
  }
  .wcard .big { font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12)); }
  .wcard .cond { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.25rem; margin-top: 6px; }
  .wcard .stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; color: var(--ink-soft); font-size: 0.9rem; font-weight: 700; }
  .wcard .stats b { color: var(--ink); }

  .q {
    font-family: "Fredoka", sans-serif; font-weight: 600;
    font-size: 1.2rem; text-align: center; margin-bottom: 16px; line-height: 1.25;
  }

  .options { display: grid; gap: 11px; }
  .opt {
    border: 2px solid var(--line); background: #fff;
    border-radius: 16px; padding: 15px 16px; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 1rem; color: var(--ink);
    text-align: left; width: 100%;
    transition: border-color .12s ease, background .12s ease, transform .05s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--city); }
  .opt:active:not(:disabled) { transform: translateY(1px); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong   { background: var(--bad-bg);  border-color: var(--bad); }

  .feedback { text-align: center; font-weight: 800; margin: 16px 0 4px; min-height: 1.2em; font-size: 1.02rem; }
  .feedback.good { color: var(--good); }
  .feedback.bad  { color: var(--bad); }

  .btn {
    border: 0; cursor: pointer; font-family: "Fredoka", sans-serif; font-weight: 600;
    font-size: 1.05rem; border-radius: 16px; padding: 15px 18px; width: 100%;
    transition: transform .05s ease, filter .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--city); color: #fff; box-shadow: 0 6px 16px rgba(47,116,224,0.35); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: #eef3fa; color: var(--ink); margin-top: 10px; }

  .banner {
    text-align: center; padding: 14px; border-radius: 16px;
    background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad);
    margin-bottom: 12px; font-weight: 800; font-size: 0.95rem;
  }
  .muted { color: var(--ink-soft); }
  input[type="text"] {
    width: 100%; font-family: inherit; font-weight: 700; font-size: 1rem;
    padding: 15px 16px; border-radius: 16px; border: 2px solid var(--line);
    background: #fff; color: var(--ink); margin-bottom: 12px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--city); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; margin-top: 22px; font-size: 0.82rem; color: #45577c; font-weight: 700;
  }
  footer a { color: var(--city); }
</style>
</head>

<script>
/* =========================================================================
   Guess the Weather — browser edition
   Open-Meteo is keyless, so the browser can call it directly: no backend,
   no secret to expose.
   ========================================================================= */

// ---- City data (climate-diverse; hard-coded coords => one call per question) ----
const CITIES = [
  {name:"Reykjavik", country:"Iceland", lat:64.15, lon:-21.90},

  {name:"Toronto", country:"Canada", lat:43.65, lon:-79.38},
  {name:"New York", country:"USA", lat:40.71, lon:-74.01},
  {name:"Denver", country:"USA", lat:39.74, lon:-104.99},
  {name:"Chicago", country:"USA", lat:41.88, lon:-87.63},
  {name:"Seattle", country:"USA", lat:47.61, lon:-122.33},

  {name:"Rome", country:"Italy", lat:41.90, lon:12.50},
  {name:"Madrid", country:"Spain", lat:40.42, lon:-3.70},
  {name:"Cairo", country:"Egypt", lat:30.04, lon:31.24},
  {name:"Dubai", country:"UAE", lat:25.20, lon:55.27},
  {name:"Mumbai", country:"India", lat:19.08, lon:72.88},
  {name:"Delhi", country:"India", lat:28.61, lon:77.21},
  {name:"Bangkok", country:"Thailand", lat:13.76, lon:100.50},
  {name:"Singapore", country:"Singapore", lat:1.35, lon:103.82},
  {name:"Nairobi", country:"Kenya", lat:-1.29, lon:36.82},
  {name:"Cape Town", country:"South Africa", lat:-33.92, lon:18.42},
  {name:"Lima", country:"Peru", lat:-12.05, lon:-77.04},
  {name:"Mexico City", country:"Mexico", lat:19.43, lon:-99.13},
  {name:"Buenos Aires", country:"Argentina", lat:-34.60, lon:-58.38},
  {name:"Sydney", country:"Australia", lat:-33.87, lon:151.21},
  {name:"Honolulu", country:"USA", lat:21.31, lon:-157.86},
  {name:"Phoenix", country:"USA", lat:33.45, lon:-112.07},
];

// ---- WMO weather codes -> description + emoji ----
const WMO = {
  0:["Clear sky","☀️"], 1:["Mainly clear","🌤️"], 2:["Partly cloudy","⛅"], 3:["Overcast","☁️"],
  45:["Fog","🌫️"], 48:["Rime fog","🌫️"],
  51:["Light drizzle","🌦️"], 53:["Drizzle","🌦️"], 55:["Dense drizzle","🌧️"],
  56:["Freezing drizzle","🌧️"], 57:["Freezing drizzle","🌧️"],
  61:["Slight rain","🌧️"], 63:["Rain","🌧️"], 65:["Heavy rain","⛈️"],
  66:["Freezing rain","🌧️"], 67:["Freezing rain","🌧️"],
  71:["Light snow","🌨️"], 73:["Snow","🌨️"], 75:["Heavy snow","❄️"], 77:["Snow grains","🌨️"],
  80:["Rain showers","🌦️"], 81:["Rain showers","🌧️"], 82:["Violent showers","⛈️"],
  85:["Snow showers","🌨️"], 86:["Heavy snow showers","❄️"],
  95:["Thunderstorm","⛈️"], 96:["Thunderstorm + hail","⛈️"], 99:["Thunderstorm + hail","⛈️"],
};
function describe(code){ return WMO[code] || ["Unknown conditions","❓"]; }

// ---- Settings (user-adjustable params) ----
const settings = { units: "C", rounds: 5, level: "medium" };
function cToF(c){ return c * 9/5 + 32; }
function fmtTemp(c){ return settings.units === "F" ? `${Math.round(cToF(c))}°F` : `${Math.round(c)}°C`; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
// The whole-number temperature a player actually sees (used to keep the
// "Hotter City" answer fair — two options must never display the same value).
function shownTemp(c){ return settings.units === "F" ? Math.round(cToF(c)) : Math.round(c); }
// Format a bucket edge in the player's chosen unit.
function edge(c){ return settings.units === "F" ? `${Math.round(cToF(c))}°F` : `${c}°C`; }

// One-line explanation of what each difficulty does (shown under the menu).
const LEVEL_HINT = {
  easy:   "🟢 Easy — the answer choices are far apart and easy to tell apart.",
  medium: "🟡 Medium — a balanced mix of choices.",
  hard:   "🔴 Hard — the choices are close together and easy to confuse.",
};

// ---- API layer -------------------------------------------------------------
class WeatherError extends Error {}

async function getJSON(url){
  let resp;
  try {
    resp = await fetch(url);
  } catch (e) {
    throw new WeatherError("Couldn't reach the weather service — check your internet connection.");
  }
  if (!resp.ok) throw new WeatherError(`The weather service returned an error (${resp.status}).`);
  try {
    return await resp.json();
  } catch (e) {
    throw new WeatherError("Got an unreadable response from the weather service.");
  }
}

async function getWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,apparent_temperature`;
  const data = await getJSON(url);
  const c = data.current;
  if (!c || c.temperature_2m === undefined || c.weather_code === undefined) {
    throw new WeatherError("Weather response was missing expected fields.");
  }
  const [desc, emoji] = describe(c.weather_code);
  return {
    temp_c: c.temperature_2m, feels_c: c.apparent_temperature,
    humidity: c.relative_humidity_2m, wind: c.wind_speed_10m,
    code: c.weather_code, desc, emoji,
  };
}

async function geocode(name){
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}`
    + `&count=1&language=en&format=json`;
  const data = await getJSON(url);
  if (!data.results || data.results.length === 0) return null;
  const r = data.results[0];
  return { name: r.name, country: r.country || "", lat: r.latitude, lon: r.longitude };
}

// ---- Small helpers ---------------------------------------------------------
const screen = document.getElementById("screen");
function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function newPanel(){ screen.innerHTML = ""; const p = el(`<div class="panel"></div>`); screen.appendChild(p); return p; }
function sample(arr, n){
  const copy = [...arr]; const out = [];
  while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  return out;
}
function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function weatherCardHTML(w, showName, name){
  return `<div class="wcard">
    <div class="big">${w.emoji}</div>
    <div class="cond">${showName ? name + " — " : ""}${w.desc}</div>
    <div class="stats">
      <span><b>${fmtTemp(w.temp_c)}</b> temp</span>
      <span>feels <b>${fmtTemp(w.feels_c)}</b></span>
      <span><b>${w.humidity}%</b> humidity</span>
      <span><b>${Math.round(w.wind)}</b> km/h wind</span>
    </div>
  </div>`;
}

// =========================================================================
//  MENU
// =========================================================================
function renderMenu(){
  screen.innerHTML = "";
  screen.appendChild(el(`<div class="pick-prompt">
    <div class="lead">👇 Choose a game mode to play</div>
    <div class="sub">Tap any card below to start</div>
  </div>`));
  const grid = el(`<div class="mode-grid"></div>`);
  const modes = [
    ["city","🏙️","Guess the City","See live weather, name the city","m-city"],
    ["temp","🌡️","Guess the Temperature","Pick the right temperature range","m-temp"],
    ["hotter","🔥","Hotter City","Two cities — pick the warmer one","m-hotter"],
    ["lookup","🔎","Weather Lookup","Check any city's weather right now","m-lookup"],
  ];
  modes.forEach(([id,emoji,t,d,cls]) => {
    const b = el(`<button class="mode-card ${cls}">
      <span class="emoji">${emoji}</span>
      <span class="body"><span class="title">${t}</span><span class="desc">${d}</span></span>
      <span class="arrow">→</span>
    </button>`);
    b.onclick = () => startMode(id);
    grid.appendChild(b);
  });
  screen.appendChild(grid);

  const s = el(`<div class="settings">
    <span>Level</span>
    <span class="seg" id="levelSeg">
      ${["easy","medium","hard"].map(l=>`<button data-l="${l}" class="${settings.level===l?"on":""}">${cap(l)}</button>`).join("")}
    </span>
    <span>Units</span>
    <span class="seg" id="unitSeg">
      <button data-u="C" class="${settings.units==="C"?"on":""}">°C</button>
      <button data-u="F" class="${settings.units==="F"?"on":""}">°F</button>
    </span>
    <span>Rounds</span>
    <span class="seg" id="roundSeg">
      ${[3,5,10].map(n=>`<button data-r="${n}" class="${settings.rounds===n?"on":""}">${n}</button>`).join("")}
    </span>
  </div>`);
  screen.appendChild(s);
  s.querySelectorAll("#levelSeg button").forEach(b => b.onclick = () => { settings.level = b.dataset.l; renderMenu(); });
  s.querySelectorAll("#unitSeg button").forEach(b => b.onclick = () => { settings.units = b.dataset.u; renderMenu(); });
  s.querySelectorAll("#roundSeg button").forEach(b => b.onclick = () => { settings.rounds = +b.dataset.r; renderMenu(); });

  const hint = el(`<div class="level-hint">${LEVEL_HINT[settings.level]}</div>`);
  screen.appendChild(hint);
}

function startMode(id){
  if (id === "lookup") return renderLookup();
  game.mode = id; game.round = 0; game.score = 0;
  nextRound();
}

// =========================================================================
//  QUIZ ENGINE (modes: city / temp / hotter)
// =========================================================================
const game = { mode: null, round: 0, score: 0 };

function loadingScreen(){
  const p = newPanel();
  p.innerHTML = `<div class="q"><span class="spin">🌀</span> Fetching live weather…</div>`;
}
function errorScreen(msg){
  const p = newPanel();
  p.appendChild(el(`<div class="banner">${msg}</div>`));
  const retry = el(`<button class="btn btn-primary">Try again</button>`);
  retry.onclick = () => nextRound();
  const back = el(`<button class="btn btn-ghost">Back to menu</button>`);
  back.onclick = renderMenu;
  p.appendChild(retry); p.appendChild(back);
}

async function nextRound(){
  game.round++;
  if (game.round > settings.rounds) return endGame();
  loadingScreen();
  try {
    if (game.mode === "city") await roundCity();
    else if (game.mode === "temp") await roundTemp();
    else if (game.mode === "hotter") await roundHotter();
  } catch (e) {
    if (e instanceof WeatherError) errorScreen(e.message);
    else errorScreen("Something went wrong loading this round.");
  }
}

function topbarHTML(){
  return `<div class="topbar"><span class="pill-tag">Round ${game.round} / ${settings.rounds} · ${cap(settings.level)}</span>
    <span class="pill-tag">Score: ${game.score}</span></div>`;
}

// Renders a multiple-choice question and wires up scoring + a Next button.
function renderQuestion({questionHTML, options, correctIndex, reveal}){
  const p = newPanel();
  p.appendChild(el(topbarHTML()));
  if (questionHTML) p.appendChild(el(questionHTML));
  const optWrap = el(`<div class="options"></div>`);
  const buttons = options.map((label, i) => {
    const b = el(`<button class="opt">${label}</button>`);
    b.onclick = () => answer(i);
    optWrap.appendChild(b);
    return b;
  });
  p.appendChild(optWrap);
  const fb = el(`<div class="feedback"></div>`);
  p.appendChild(fb);

  function answer(chosen){
    buttons.forEach((b,i) => {
      b.disabled = true;
      if (i === correctIndex) b.classList.add("correct");
      if (i === chosen && chosen !== correctIndex) b.classList.add("wrong");
    });
    if (chosen === correctIndex){ game.score++; fb.textContent = "✅ Correct! " + reveal; fb.className = "feedback good"; }
    else { fb.textContent = "❌ " + reveal; fb.className = "feedback bad"; }

    const next = el(`<button class="btn btn-primary">${game.round >= settings.rounds ? "See results" : "Next question →"}</button>`);
    next.onclick = () => nextRound();
    p.appendChild(next);
  }
}

// Mode 1: guess the city from a weather readout.
// Difficulty controls how similar the distractor cities' climates are, using
// absolute latitude as a cheap climate proxy (so we still make just ONE
// weather call per round). Easy => very different latitudes (different
// climates); Hard => similar latitudes (confusably alike).
async function roundCity(){
  const answer = CITIES[Math.floor(Math.random()*CITIES.length)];
  const others = CITIES.filter(c => c !== answer);
  const absA = Math.abs(answer.lat);
  let pool = others;
  if (settings.level === "hard") {
    pool = [...others].sort((a,b) =>
      Math.abs(Math.abs(a.lat)-absA) - Math.abs(Math.abs(b.lat)-absA)).slice(0, 8);
  } else if (settings.level === "easy") {
    pool = [...others].sort((a,b) =>
      Math.abs(Math.abs(b.lat)-absA) - Math.abs(Math.abs(a.lat)-absA)).slice(0, 8);
  }
  const picks = shuffle([answer, ...sample(pool, 3)]);
  const w = await getWeather(answer.lat, answer.lon);
  renderQuestion({
    questionHTML: weatherCardHTML(w, false) + `<div class="q">Which city has this weather right now?</div>`,
    options: picks.map(c => `${c.name}, ${c.country}`),
    correctIndex: picks.indexOf(answer),
    reveal: `It's ${answer.name}, ${answer.country}.`,
  });
}

// Mode 2: guess the temperature bucket.
// Easy => wide buckets, distractors chosen as far as possible from the answer.
// Medium => wide buckets, random distractors.
// Hard => narrow 5° buckets with neighbouring ranges as distractors.
function bucketOf(c){ if (c<0) return 0; if (c<10) return 1; if (c<20) return 2; if (c<30) return 3; return 4; }
function wideLabel(i){
  const e = [0,10,20,30];
  if (i === 0) return `Below ${edge(0)}`;
  if (i === 4) return `Above ${edge(30)}`;
  return `${edge(e[i-1])}–${edge(e[i])}`;
}
function fineLabel(lo){ return `${edge(lo)}–${edge(lo+5)}`; }

async function roundTemp(){
  const city = CITIES[Math.floor(Math.random()*CITIES.length)];
  const w = await getWeather(city.lat, city.lon);
  const c = w.temp_c;
  let correct, opts;

  if (settings.level === "hard") {
    const lo = Math.floor(c/5)*5;               // nearest 5° bucket below temp
    correct = fineLabel(lo);
    const neighbours = [-2,-1,1,2].map(k => fineLabel(lo + k*5));
    opts = shuffle([correct, ...sample(neighbours, 3)]);
  } else {
    const ci = bucketOf(c);
    correct = wideLabel(ci);
    let idxs = [0,1,2,3,4].filter(i => i !== ci);
    if (settings.level === "easy") {
      idxs.sort((a,b) => Math.abs(b-ci) - Math.abs(a-ci)); // farthest buckets first
      idxs = idxs.slice(0, 3);
    } else {
      idxs = sample(idxs, 3);
    }
    opts = shuffle([correct, ...idxs.map(wideLabel)]);
  }

  renderQuestion({
    questionHTML: `<div class="q">🌡️ What's the current temperature in<br><b>${city.name}, ${city.country}</b>?</div>`,
    options: opts,
    correctIndex: opts.indexOf(correct),
    reveal: `It's ${fmtTemp(c)} in ${city.name}.`,
  });
}

// Mode 3: which city is hotter.
// Fetch a small pool, then pick a pair by temperature gap: Easy => biggest
// gap, Medium => middling, Hard => smallest gap that still shows two DIFFERENT
// rounded temperatures (so the answer is never ambiguous).
async function roundHotter(){
  const poolCities = sample(CITIES, 6);
  const ws = await Promise.all(poolCities.map(c => getWeather(c.lat, c.lon)));
  const arr = poolCities.map((c,i) => ({ c, w: ws[i] }));

  // All pairs whose displayed (rounded) temperatures differ.
  const pairs = [];
  for (let i=0; i<arr.length; i++)
    for (let j=i+1; j<arr.length; j++)
      if (shownTemp(arr[i].w.temp_c) !== shownTemp(arr[j].w.temp_c))
        pairs.push({ a: arr[i], b: arr[j], gap: Math.abs(arr[i].w.temp_c - arr[j].w.temp_c) });
  pairs.sort((x,y) => x.gap - y.gap);

  let chosen;
  if (pairs.length === 0) {                 // extremely rare: everything ties
    chosen = { a: arr[0], b: arr[arr.length-1] };
  } else if (settings.level === "easy") {
    chosen = pairs[pairs.length-1];         // biggest gap
  } else if (settings.level === "hard") {
    chosen = pairs[0];                       // smallest distinguishable gap
  } else {
    chosen = pairs[Math.floor(pairs.length/2)];
  }

  const two = shuffle([chosen.a, chosen.b]);
  const aHotter = two[0].w.temp_c > two[1].w.temp_c;
  renderQuestion({
    questionHTML: `<div class="q">🔥 Which city is warmer right now?</div>`,
    options: two.map(x => `${x.c.name}, ${x.c.country}`),
    correctIndex: aHotter ? 0 : 1,
    reveal: `${two[0].c.name} ${fmtTemp(two[0].w.temp_c)} · ${two[1].c.name} ${fmtTemp(two[1].w.temp_c)}.`,
  });
}

function endGame(){
  const pct = game.score / settings.rounds;
  let msg = "Rough one! The atmosphere had other plans.";
  let face = "🌧️";
  if (pct === 1) { msg = "Perfect round — you really know your weather!"; face = "🏆"; }
  else if (pct >= 0.6) { msg = "Nice work — sharp guessing."; face = "🎯"; }
  else if (pct > 0) { msg = "Not bad — the planet is a big place."; face = "🌍"; }
  const p = newPanel();
  p.innerHTML = `<div class="wcard">
      <div class="big">${face}</div>
      <div class="cond">You scored ${game.score} / ${settings.rounds}</div>
    </div>
    <div class="feedback good">${msg}</div>`;
  const again = el(`<button class="btn btn-primary">Play again</button>`);
  again.onclick = () => startMode(game.mode);
  const menu = el(`<button class="btn btn-ghost">Back to menu</button>`);
  menu.onclick = renderMenu;
  p.appendChild(again); p.appendChild(menu);
}

// =========================================================================
//  MODE 4: LOOKUP (free-text; uses the geocoding endpoint)
// =========================================================================
function renderLookup(){
  const p = newPanel();
  p.appendChild(el(`<div class="q">🔎 Weather Lookup</div>`));
  const input = el(`<input type="text" placeholder="Type a city, e.g. Paris" autocomplete="off">`);
  p.appendChild(input);
  const row = el(`<div class="row"></div>`);
  const go = el(`<button class="btn btn-primary">Get weather</button>`);
  const back = el(`<button class="btn btn-ghost" style="margin-top:0">Back to menu</button>`);
  row.appendChild(go); row.appendChild(back);
  p.appendChild(row);
  const result = el(`<div id="lookupResult" style="margin-top:14px"></div>`);
  p.appendChild(result);
  back.onclick = renderMenu;

  async function doLookup(){
    const name = input.value.trim();
    if (!name){ result.innerHTML = `<div class="feedback muted">Please type a city name.</div>`; return; }
    result.innerHTML = `<div class="q"><span class="spin">🌀</span> Looking up ${name}…</div>`;
    try {
      const place = await geocode(name);
      if (!place){ result.innerHTML = `<div class="banner">Couldn't find a city called “${name}”. Check the spelling.</div>`; return; }
      const w = await getWeather(place.lat, place.lon);
      const title = [place.name, place.country].filter(Boolean).join(", ");
      result.innerHTML = weatherCardHTML(w, true, title);
    } catch (e) {
      const msg = (e instanceof WeatherError) ? e.message : "Something went wrong.";
      result.innerHTML = `<div class="banner">${msg}</div>`;
    }
  }
  go.onclick = doLookup;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doLookup(); });
  input.focus();
}

// ---- Boot ----
renderMenu();
</script>
</body>
